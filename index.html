<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa PV">
<title>Mapa PV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  /* Kierunek: narzędzie terenowe czytelne w słońcu. Mapa jest bohaterem, interfejs to neutralne,
     półprzezroczyste „szkło” nad ortofotomapą; kolor niosą wyłącznie statusy domów. */
  :root{
    --ink:#172033; --mut:#5b6678; --line:#dde3ea; --mist:#eef1f5; --paper:#fff;
    --glass:rgba(255,255,255,.88); --sh:0 10px 30px rgba(15,23,42,.24),0 1px 3px rgba(15,23,42,.14);
    --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--ink);background:#1b2430;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
  .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .glass{background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);box-shadow:var(--sh)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
  #map{position:fixed;inset:0;background:#1b2430}

  /* górny pasek: liczniki + menu */
  .bar{position:fixed;top:calc(10px + var(--top));left:10px;right:10px;z-index:1000;display:flex;gap:8px;align-items:center;pointer-events:none}
  body.tooling .bar{display:none}
  .stats{pointer-events:auto;flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-radius:999px;padding:5px}
  .stats::-webkit-scrollbar{display:none}
  .chip{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 11px 7px 9px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut)}
  .chip b{color:var(--ink);font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}
  .round{pointer-events:auto;width:50px;height:50px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
  .round .ic{width:22px;height:22px}

  /* pionowy dok akcji pod kciukiem */
  .dock{position:fixed;right:10px;bottom:calc(22px + var(--bot));z-index:1000;display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:30px}
  .dock button{width:48px;height:48px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center}
  .dock button .ic{width:22px;height:22px}
  .dock #addbtn{background:var(--ink);color:#fff}
  .dock #addbtn.on{background:#9333ea}
  body.tooling .dock{display:none}
  .leaflet-control-zoom{border:0!important;box-shadow:var(--sh)!important;border-radius:14px!important;overflow:hidden}
  .leaflet-control-zoom a{width:38px!important;height:38px!important;line-height:36px!important;color:var(--ink)!important;background:var(--glass)!important;font-size:20px!important}
  @media (pointer:coarse){.leaflet-control-zoom{display:none}}
  .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.6)!important;border-radius:8px 0 0 0}
  .leaflet-bottom.leaflet-left{margin-bottom:var(--bot)}

  #addhint{position:fixed;top:calc(72px + var(--top));left:50%;transform:translateX(-50%);z-index:1004;background:#9333ea;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:650;display:none;box-shadow:var(--sh);text-align:center;white-space:nowrap}

  /* menu */
  .panel{position:fixed;top:calc(70px + var(--top));right:10px;z-index:1001;border-radius:24px;padding:8px;width:310px;max-width:calc(100% - 20px);display:none;max-height:calc(100% - 100px - var(--top) - var(--bot));overflow:auto;background:rgba(255,255,255,.95)}
  .panel.open{display:block}
  .who{display:flex;align-items:center;gap:10px;padding:8px 8px 12px}
  .ava{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:750;flex:none}
  .who .n{font-weight:700;font-size:15px;line-height:1.2}
  .who small{display:block;color:var(--mut);font-size:12px}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff;background:#6b7280;margin-top:3px}
  .badge.admin{background:var(--ink)}.badge.manager{background:#ea580c}.badge.handlowiec{background:#0284c7}
  .grp{background:var(--mist);border-radius:18px;padding:4px;margin-top:8px}
  .grp-t{font-size:13px;font-weight:650;color:var(--mut);padding:8px 10px 4px}
  .tog{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:14px;border-radius:14px;cursor:pointer}
  .tog .cnt{margin-left:auto;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
  .sw{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:#cbd3dd;position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
  .sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .sw:checked{background:var(--ink)}
  .sw:checked:after{transform:translateX(16px)}
  .act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:14px;padding:11px 10px;font-size:14px;font-weight:600}
  .act:active{background:#e2e7ee}
  .act .ic{color:var(--mut)}

  /* role */
  body:not(.role-admin) .only-admin{display:none!important}
  body:not(.role-admin):not(.role-manager) .only-team{display:none!important}
  body.role-admin .only-field{display:none!important}

  /* arkusze (karta domu, lista, zespół) */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:1002;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(15,23,42,.3);max-width:560px;margin:0 auto}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
  .x{position:absolute;top:12px;right:12px;border:0;background:var(--mist);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
  .x .ic{width:18px;height:18px}

  #sheet{padding:4px 16px calc(16px + var(--bot));transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto}
  #sheet.open{transform:none}
  @media (prefers-reduced-motion:reduce){#sheet{transition:none}}
  #sheet h2{margin:8px 48px 6px 0;font-size:20px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .meta span{font-size:12px;font-weight:600;color:var(--mut);background:var(--mist);border-radius:999px;padding:4px 9px}
  .nav{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:var(--ink);color:#fff;border-radius:18px;padding:15px;font-weight:700;font-size:16px;margin-bottom:12px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--mist);border-radius:16px;padding:4px;margin-bottom:12px}
  .seg button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;border-radius:12px;padding:10px 6px;font-size:14px;font-weight:650;color:var(--mut)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.16)}
  .seg button[data-v=jest].on .ic{color:#16a34a}
  .seg button[data-v=nie].on .ic{color:#dc2626}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .st{--c:#6b7280;display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:650;text-align:left;line-height:1.2}
  .st .ic{color:var(--c);width:22px;height:22px}
  .st.on{background:var(--c);border-color:var(--c);color:#fff}
  .st.on .ic{color:#fff}
  .st.wide{grid-column:span 2}
  .note{width:100%;margin-top:12px;border:0;background:var(--mist);border-radius:16px;padding:12px;font:inherit;font-size:16px;resize:none;height:64px;color:var(--ink)}
  .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
  .foot small{color:var(--mut);font-size:12px}
  .lnk{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:13px;font-weight:650;text-decoration:none;border:0;background:transparent;padding:6px 0}
  .lnk .ic{width:16px;height:16px}
  .lnk.red{color:#dc2626}

  #list,#team{top:14%;display:none;flex-direction:column}
  #list{top:30%}
  #list.open,#team.open{display:flex}
  .sheet header{padding:6px 64px 12px 18px;position:relative}
  .sheet header b{font-size:19px;font-weight:750;display:block;margin-top:6px}
  .sheet header small{display:block;color:var(--mut);margin-top:3px;font-size:13px}
  #list ul{list-style:none;margin:0;padding:0 8px var(--bot);overflow:auto;flex:1}
  #list li{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:16px;cursor:pointer}
  #list li:active{background:var(--mist)}
  #list li .t{flex:1;min-width:0}
  #list li .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px}
  #list li .t small{color:var(--mut);font-size:12px}
  .go{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;text-decoration:none;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700}
  .go .ic{width:16px;height:16px}

  /* zespół */
  #team{background:var(--mist)}
  #team header{background:var(--paper);border-radius:26px 26px 0 0}
  #teambody{overflow:auto;flex:1;padding:4px 10px calc(16px + var(--bot))}
  .h{font-size:13px;font-weight:650;color:var(--mut);margin:16px 8px 8px}
  .card{background:#fff;border-radius:20px;padding:12px;margin-bottom:10px}
  .card .nm{width:100%;border:1.5px solid transparent;border-radius:10px;padding:4px 6px;font:inherit;font-size:16px;font-weight:700;background:transparent}
  .card .nm:hover,.card .nm:focus{border-color:var(--line)}
  .card .nmt{font-size:16px;font-weight:700;padding:4px 6px}
  .card small{display:block;color:var(--mut);padding:0 6px;font-size:12px}
  .card .cr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 6px 6px;font-size:13px;color:var(--mut)}
  .card select{font:inherit;font-size:14px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);margin-left:4px}
  .ters{margin-top:8px;border-radius:14px;background:var(--mist);padding:2px 4px}
  .ter{display:flex;align-items:center;gap:8px;padding:8px 6px;font-size:14px}
  .ter + .ter{border-top:1px solid var(--line)}
  .ter .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .ter.none{color:var(--mut);font-size:13px}
  .ter button{border:0;background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:650}
  .ter button.del{color:#dc2626}
  .ter button.del.sure{background:#dc2626;color:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .two button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 8px;font-size:13px;font-weight:700;background:var(--ink);color:#fff}
  .two button.sec{background:var(--mist);color:var(--ink)}
  .two .ic{width:18px;height:18px}
  .hint{color:var(--mut);font-size:13px;margin:8px 8px 12px;line-height:1.4}
  .warn{color:#dc2626!important}

  /* pasek narzędzia (wybór granicy / rysowanie) */
  #tool{position:fixed;top:calc(10px + var(--top));left:10px;right:10px;z-index:1004;border-radius:24px;padding:14px;display:none;max-width:540px;margin:0 auto;background:rgba(255,255,255,.95)}
  body.tooling #tool{display:block}
  #tool .tt{font-size:15px;font-weight:700;padding-right:4px}
  #tool .ts{color:var(--mut);font-size:13px;margin-top:3px;line-height:1.35}
  #tool .seg{margin:10px 0 0}
  #tool input{width:100%;border:0;background:var(--mist);border-radius:14px;padding:11px 12px;font:inherit;font-size:16px;margin-top:10px}
  #tool .found{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--mist);border-radius:14px;padding:10px 12px;font-weight:700}
  #tool .found .ic{color:#16a34a}
  #tool .r{display:flex;gap:8px;margin-top:10px}
  #tool .r button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 6px;font-weight:700;background:var(--mist)}
  #tool .r button.pri{background:var(--ink);color:#fff}
  #tool .r button:disabled{opacity:.4}
  .tlabel{background:rgba(255,255,255,.9);border:0;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-weight:700;font-size:12px;padding:3px 8px;color:var(--ink)}
  .tlabel:before{display:none}

  /* logowanie */
  #login{position:fixed;inset:0;z-index:2000;background:linear-gradient(160deg,#e9edf3,#f7f8fa 60%);display:flex;align-items:center;justify-content:center;padding:20px}
  #login form{background:#fff;border-radius:28px;box-shadow:0 20px 50px rgba(15,23,42,.12);padding:28px 24px;width:100%;max-width:370px}
  .mark{width:54px;height:54px;border-radius:17px;background:var(--ink);color:#fff;display:grid;place-items:center;margin-bottom:18px}
  .mark .ic{width:28px;height:28px}
  #login h1{margin:0 0 4px;font-size:24px;font-weight:750;letter-spacing:-.02em}
  #login p{margin:0 0 20px;color:var(--mut);font-size:14px}
  #login label{display:block;font-size:13px;font-weight:650;color:var(--mut);margin:0 0 6px 2px}
  #login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-size:16px;margin-bottom:14px;background:#fff}
  #login input:focus{border-color:var(--ink);outline:none}
  #login button{width:100%;border:0;background:var(--ink);color:#fff;border-radius:16px;padding:15px;font-size:16px;font-weight:700;margin-top:4px}
  #login .err{color:#dc2626;font-size:14px;min-height:20px;margin-top:10px}

  #msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + var(--bot));z-index:2001;background:var(--ink);color:#fff;padding:11px 16px;border-radius:16px;font-size:14px;font-weight:550;display:none;max-width:min(440px,calc(100% - 96px));text-align:center;box-shadow:var(--sh)}
  .medot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
</style>
</head>
<body>

<div id="map"></div>

<div class="bar">
  <div class="stats glass" id="stats"><span class="chip">Ładowanie…</span></div>
  <button class="round glass" id="menubtn" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
</div>

<div class="panel glass" id="panel">
  <div class="who" id="who"></div>
  <div class="grp"><div class="grp-t">Pokaż na mapie</div><div id="filters"></div></div>
  <div class="grp">
    <label class="tog"><input type="checkbox" class="sw" id="addrLayer" checked>Numery domów i ulice</label>
    <label class="tog"><input type="checkbox" class="sw" id="terLayer" checked>Granice terenów</label>
  </div>
  <div class="grp">
    <button class="act only-team" id="teambtn"><svg class="ic"><use href="#i-users"/></svg><span>Zespół i tereny</span></button>
    <button class="act only-field" id="myterbtn"><svg class="ic"><use href="#i-map"/></svg>Pokaż mój teren</button>
    <button class="act only-admin" id="importbtn"><svg class="ic"><use href="#i-import"/></svg>Importuj pinezki z pliku</button>
    <button class="act only-admin" id="updbtn"><svg class="ic"><use href="#i-sync"/></svg>Aktualizuj powiat z pliku</button>
    <button class="act only-admin" id="exportbtn"><svg class="ic"><use href="#i-export"/></svg>Eksportuj dane do douczenia modelu</button>
    <button class="act" id="reloadbtn"><svg class="ic"><use href="#i-refresh"/></svg>Odśwież dane</button>
    <button class="act" id="logoutbtn"><svg class="ic"><use href="#i-logout"/></svg>Wyloguj</button>
  </div>
  <input type="file" id="file" accept=".json,.csv" hidden>
  <input type="file" id="updfile" accept=".json" hidden>
</div>

<div class="dock glass">
  <button id="addbtn" title="Dodaj pominięty dom" aria-label="Dodaj pominięty dom"><svg class="ic"><use href="#i-plus"/></svg></button>
  <button id="listbtn" title="Najbliższe domy" aria-label="Najbliższe domy"><svg class="ic"><use href="#i-list"/></svg></button>
  <button id="me" title="Moja pozycja" aria-label="Moja pozycja"><svg class="ic"><use href="#i-locate"/></svg></button>
</div>
<div id="addhint">Stuknij w mapę, gdzie stoi dom z PV</div>

<div id="sheet" class="sheet">
  <div class="grab"></div>
  <button class="x" id="close" aria-label="Zamknij"><svg class="ic"><use href="#i-close"/></svg></button>
  <h2 id="t"></h2>
  <div class="meta" id="sub"></div>
  <a class="nav" id="nav" target="_blank" rel="noopener"><svg class="ic"><use href="#i-nav"/></svg>Nawiguj</a>
  <div class="seg" id="pvseg">
    <button class="pvb" data-v="jest"><svg class="ic"><use href="#i-sun"/></svg>Jest PV</button>
    <button class="pvb" data-v="nie"><svg class="ic"><use href="#i-sunoff"/></svg>Nie ma PV</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <textarea class="note" id="note" placeholder="Notatka, np. wrócić w sobotę po 16"></textarea>
  <div class="foot">
    <small id="saved"></small>
    <a class="lnk" id="gm" target="_blank" rel="noopener"><svg class="ic"><use href="#i-ext"/></svg>Google Maps</a>
  </div>
  <div class="foot only-admin"><button class="lnk red" id="delbtn"><svg class="ic"><use href="#i-trash"/></svg><span>Usuń pinezkę</span></button></div>
</div>

<div id="list" class="sheet">
  <div class="grab"></div>
  <header><b>Najbliższe domy</b><small id="listsub"></small><button class="x" id="listclose" aria-label="Zamknij"><svg class="ic"><use href="#i-close"/></svg></button></header>
  <ul id="ul"></ul>
</div>

<div id="team" class="sheet">
  <header><div class="grab"></div><b id="teamtitle">Zespół i tereny</b><small id="teamsub"></small><button class="x" id="teamclose" aria-label="Zamknij"><svg class="ic"><use href="#i-close"/></svg></button></header>
  <div id="teambody"></div>
</div>

<div id="tool" class="glass"></div>

<div id="login" style="display:none">
  <form id="loginform">
    <div class="mark"><svg class="ic"><use href="#i-home"/></svg></div>
    <h1>Mapa PV</h1>
    <p>Zaloguj się, aby zobaczyć domy na swoim terenie.</p>
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="pass">Hasło</label>
    <input type="password" id="pass" autocomplete="current-password" required>
    <button type="submit" id="loginbtn">Zaloguj</button>
    <div class="err" id="loginerr"></div>
  </form>
</div>

<div id="msg" role="status"></div>

<script src="lib/leaflet.js"></script>
<script src="lib/proj4.js"></script>
<script src="lib/proj4leaflet.js"></script>
<script src="lib/supabase.js"></script>
<script src="config.js?v=2026112404"></script>
<script src="app.js?v=2026112404"></script>
</body>
</html>
